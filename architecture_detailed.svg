<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 734" width="100%" role="img" aria-labelledby="ar2-title ar2-desc" class="ar-diagram">
<title id="ar2-title">Asset Readiness detailed architecture</title>
<desc id="ar2-desc">Data from six sources flows into a Databricks lakehouse, then through a failure-risk model, a parts-demand forecast and a stock optimizer, then to a planner dashboard, a technician assistant and human approval, with a trust layer across all of it.</desc>
<style>.ar-t{font:600 14px "IBM Plex Sans",system-ui,Arial,sans-serif}.ar-s{font:400 12.5px "IBM Plex Sans",system-ui,Arial,sans-serif}.ar-c{font:500 12.5px "IBM Plex Mono",ui-monospace,monospace;fill:#0d5f7c;letter-spacing:.04em}.ar-lg{font:400 12.5px "IBM Plex Sans",system-ui,Arial,sans-serif;fill:#15222e}</style>
<defs><marker id="ar-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15222e"/></marker>
<marker id="ar-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d5f7c"/></marker></defs>
<rect width="1180" height="734" fill="#f3f4ef"/>
<text x="115.0" y="40" class="ar-c" text-anchor="middle">1 · SOURCES</text>
<text x="395.0" y="40" class="ar-c" text-anchor="middle">2 · DATABRICKS LAKEHOUSE</text>
<text x="720.0" y="40" class="ar-c" text-anchor="middle">3 · INTELLIGENCE</text>
<text x="1030.0" y="40" class="ar-c" text-anchor="middle">4 · PEOPLE AND APPS</text>
<rect x="20" y="60" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="82" class="ar-t" fill="#15222e">Asset registry</text>
<text x="32" y="101" class="ar-s" fill="#566570">age, type, location</text>
<rect x="20" y="144" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="166" class="ar-t" fill="#15222e">Inspections, sensors</text>
<text x="32" y="185" class="ar-s" fill="#566570">condition readings</text>
<rect x="20" y="228" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="250" class="ar-t" fill="#15222e">Work orders, manuals</text>
<text x="32" y="269" class="ar-s" fill="#566570">repair history, guides</text>
<rect x="20" y="312" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="334" class="ar-t" fill="#15222e">Parts inventory</text>
<text x="32" y="353" class="ar-s" fill="#566570">stock by warehouse</text>
<rect x="20" y="396" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="418" class="ar-t" fill="#15222e">Supplier lead times</text>
<text x="32" y="437" class="ar-s" fill="#566570">weeks to deliver</text>
<rect x="20" y="480" width="190" height="68" rx="9" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/>
<text x="32" y="502" class="ar-t" fill="#15222e">Weather and storms</text>
<text x="32" y="521" class="ar-s" fill="#566570">severity by region</text>
<rect x="240" y="56" width="310" height="496" rx="12" fill="#f7faf9" stroke="#b85a0b" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="256" y="76" width="278" height="84" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="268" y="98" class="ar-t" fill="#15222e">Ingest and quality checks</text>
<text x="268" y="117" class="ar-s" fill="#566570">catch duplicates, missing assets</text>
<text x="268" y="133" class="ar-s" fill="#566570">and bad readings before models</text>
<rect x="256" y="192" width="278" height="120" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="268" y="214" class="ar-t" fill="#15222e">Governed Delta tables</text>
<text x="268" y="233" class="ar-s" fill="#566570">raw  →  cleaned  →  model-ready</text>
<text x="268" y="249" class="ar-s" fill="#566570">one asset ID joins everything</text>
<text x="268" y="265" class="ar-s" fill="#566570">history kept for retraining</text>
<rect x="256" y="344" width="278" height="84" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="268" y="366" class="ar-t" fill="#15222e">Access control and lineage</text>
<text x="268" y="385" class="ar-s" fill="#566570">who can see what, and where</text>
<text x="268" y="401" class="ar-s" fill="#566570">each number came from (Unity Catalog)</text>
<rect x="256" y="460" width="278" height="76" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="268" y="482" class="ar-t" fill="#15222e">Model tracking</text>
<text x="268" y="501" class="ar-s" fill="#566570">every model version and its</text>
<text x="268" y="517" class="ar-s" fill="#566570">test scores recorded (MLflow)</text>
<rect x="590" y="76" width="260" height="112" rx="9" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="602" y="98" class="ar-t" fill="#15222e">Failure-risk model</text>
<text x="602" y="117" class="ar-s" fill="#566570">gradient boosting, 6 inputs</text>
<text x="602" y="133" class="ar-s" fill="#566570">age, load, inspection, oil,</text>
<text x="602" y="149" class="ar-s" fill="#566570">past failures, storm severity</text>
<rect x="590" y="220" width="260" height="96" rx="9" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="602" y="242" class="ar-t" fill="#15222e">Parts-demand forecast</text>
<text x="602" y="261" class="ar-s" fill="#566570">adds up risk by region</text>
<text x="602" y="277" class="ar-s" fill="#566570">and part type</text>
<rect x="590" y="348" width="260" height="124" rx="9" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="602" y="370" class="ar-t" fill="#15222e">Stock optimizer</text>
<text x="602" y="389" class="ar-s" fill="#566570">today: split fixed spares by</text>
<text x="602" y="405" class="ar-s" fill="#566570">expected failures</text>
<text x="602" y="421" class="ar-s" fill="#566570">next: budgets, lead times,</text>
<text x="602" y="437" class="ar-s" fill="#566570">transfers between sites</text>
<rect x="900" y="76" width="260" height="112" rx="9" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="912" y="98" class="ar-t" fill="#15222e">Planner dashboard</text>
<text x="912" y="117" class="ar-s" fill="#566570">storm what-if, spares by region</text>
<text x="912" y="133" class="ar-s" fill="#566570">assets most at risk</text>
<text x="912" y="149" class="ar-s" fill="#566570">(Live model page)</text>
<rect x="900" y="220" width="260" height="112" rx="9" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="912" y="242" class="ar-t" fill="#15222e">Technician assistant</text>
<text x="912" y="261" class="ar-s" fill="#566570">reads manuals and work orders</text>
<text x="912" y="277" class="ar-s" fill="#566570">from the lakehouse, refuses when</text>
<text x="912" y="293" class="ar-s" fill="#566570">the answer is not there</text>
<rect x="900" y="364" width="260" height="108" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="912" y="386" class="ar-t" fill="#15222e">Human approval</text>
<text x="912" y="405" class="ar-s" fill="#566570">a planner approves every</text>
<text x="912" y="421" class="ar-s" fill="#566570">order or transfer</text>
<rect x="900" y="504" width="260" height="60" rx="9" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/>
<text x="912" y="526" class="ar-t" fill="#15222e">Work-order / ERP system</text>
<text x="912" y="545" class="ar-s" fill="#566570">orders and moves are recorded</text>
<path d="M210,94 L240,94" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M210,178 L240,178" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M210,262 L240,262" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M210,346 L240,346" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M210,430 L240,430" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M210,514 L240,514" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M395,160 L395,192" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M395,312 L395,344" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M550,250 L590,132" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M550,250 L590,268" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M550,250 L590,410" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M720,188 L720,220" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M720,316 L720,348" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M850,132 L900,132" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M850,410 L900,410" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M1030,472 L1030,504" stroke="#15222e" stroke-width="1.8" fill="none" marker-end="url(#ar-ah)"/>
<path d="M1030,564 L1030,612 L395,612 L395,552" stroke="#0d5f7c" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar-ah2)"/>
<text x="712" y="604" class="ar-s" fill="#0d5f7c" text-anchor="middle">real failures and orders flow back, so the next model learns from what happened</text>
<rect x="20" y="632" width="1140" height="52" rx="9" fill="#ffffff" stroke="#0d5f7c" stroke-width="1.6"/>
<text x="34" y="654" class="ar-t" fill="#15222e">Trust layer across everything</text>
<text x="34" y="674" class="ar-s" fill="#566570">Held-out test years and a plain baseline to beat  ·  budget and cost caps  ·  audit log of every recommendation  ·  a human approves orders  ·  guardrails on the assistant</text>
<g transform="translate(20,708)"><rect width="14" height="14" rx="3" fill="#e3f0f4" stroke="#0d5f7c" stroke-width="1.6"/><text x="22" y="12" class="ar-lg">Prototype on synthetic data</text>
<rect x="260" width="14" height="14" rx="3" fill="#fbeadb" stroke="#b85a0b" stroke-width="1.6"/><text x="282" y="12" class="ar-lg">Proposed, not built</text>
<rect x="470" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a959c" stroke-width="1.6"/><text x="492" y="12" class="ar-lg">Client's existing data</text></g>
</svg>